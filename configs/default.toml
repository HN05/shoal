# Shoal machine configuration. Values shown are the defaults; edit them in place.
# The daemon reads this file when it starts, so changes take effect after
# `shoal daemon restart`, except agent settings, which the CLI reads on every
# command. Commented blocks
# are examples, not defaults: uncomment a whole block and adapt it. A repository's
# .shoal.toml (or the config saved with `shoal repo config`) holds its named
# ports, setup and hook commands and resource pools, and may set any value below
# for that repository except root_dir, AI skill directories, the simulator limits and profiles, Git profile definitions, and
# the shared resources.

# Parent of every repository's workspaces and URL clones.
root_dir = "~/shoal"

# Agent `shoal issue <url>` starts when --agent is omitted (no default):
# A built-in launcher or a name defined in [commands].
# default_agent = "codex"

# Prompt templates normally live beside this file as issue-template.md and
# agent-template.md. Inline text takes precedence over the corresponding file.
# issue_template = "Work on issue #{number}: {title}\n{url}\n\n{body}"
# agent_template = "Follow repository instructions in {workspace} at {path}."

# Git identity for new worktrees (no default); may also be set per repository.
# git_profile = "work"

# Named Git settings; omitted keys keep their normal Git values.
# [git.profiles.work]
# user.name = "Your Name"
# user.email = "you@example.com"
# commit.gpgsign = false

# Named workspace shortcuts: shoal check [workspace] -- <extra arguments>
[commands]
claude = ["claude", "{args}", "--remote-control", "{workspace}"]
codex = ["codex", "{args}", "--sandbox", "danger-full-access", "--ask-for-approval=never"]
# check = ["cargo", "test"]
# Custom agents: shoal add <repository> <branch> --agent pi
# pi = ["pi", "{args}"]
# opencode = ["opencode", "--prompt", "{prompt}", "{args}"]
# Local committed-change review, with tuicr installed on PATH:
# review = ["tuicr", "-r", "{diff_base}..HEAD"]

# Separate forge logins for tracked agents; user-owned executable wrappers.
# See docs/reference.md#agent-forge-authentication for setup.
# [agent_auth]
# fj = "~/bin/fj-agent"
# gh = "~/bin/gh-agent"

# User-level skill locations for additional AI tools: shoal skill install pi.
# Shoal adds shoal/SKILL.md beneath skill_dir. Launchers belong in [commands].
# [ai.pi]
# skill_dir = "~/.pi/agent/skills"

[codex]
# `shoal codex` without --cli/--app: "cli" or "app".
default_mode = "cli"

[auto_cleanup]
# Remove idle, clean, pushed or landed workspaces automatically.
enabled = true
idle_minutes = 10

[pr_cleanup]
# Remove workspaces whose watched PR has merged.
enabled = true

[ports]
# Range for automatic TCP port reservations.
start = 49152
end = 65535

[simulators]
# Xcode simulator leases (macOS).
max_booted = 2
max_devices = 4
idle_seconds = 120
allow_any = false
# Example profile; `default` must name a profile defined below it.
# default = "phone"
# [simulators.profiles.phone]
# device = "iPhone 17"
# runtime = "iOS 26"

# Example permits shared across repositories; see the command reference.
# [resources.signing]
# capacity = 1
# reason = "Signing service"
# [resource_pools.devices]
# capacity = 2
# [resource_pools.devices.resources.alpha]
# capacity = 1
