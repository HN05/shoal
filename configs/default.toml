# Shoal configuration. Values shown are the defaults; edit them in place.
# The daemon reads this file when it starts, so changes take effect after
# `shoal daemon restart`, except agent settings, which the CLI reads on every
# command. Commented blocks are examples, not defaults: uncomment a whole block
# and adapt it.
#
# The [machine] table describes this machine. Everything outside it follows the
# schema of a repository's .shoal.toml (or its local config, which
# `shoal repo config` shows), which may set any of it for that repository and
# adds the repository's setup command and seed.

# Git identity for new worktrees (no default); may also be set per repository.
# git_profile = "work"

[machine]
# Parent of every repository's workspaces and URL clones.
root_dir = "~/shoal"

# Agents that run at once; by default `dynamic` starts them one at a time while
# measured load stays below the warning thresholds `load` sets. `shoal add`
# queues the rest and starts them as slots free. Set a positive number for a
# fixed limit or `none` for unlimited admission.
# max_agents = 3

# How hard Shoal may load this machine: "light" for a computer you work on,
# "balanced", or "full" for one that only runs agents. It sets the default
# CPU and memory thresholds in [machine.overload] and dynamic agent admission.
# load = "balanced"

# Keep the machine from sleeping, including when a laptop's lid closes, while
# an agent is working or waits on a watched open PR. macOS still sleeps on a
# closed lid without an external display.
# keep_awake = false

# Named Git settings; omitted keys keep their normal Git values.
# [machine.git_profiles.work]
# user.name = "Your Name"
# user.email = "you@example.com"
# commit.gpgsign = false
# [machine.git_profiles.agent]
# user.name = "Agent Name"
# user.email = "agent@example.com"
# core.sshCommand = "ssh -i ~/.ssh/agent_key -o IdentitiesOnly=yes"

# A forge host: the API it serves, set instead of letting the daemon ask the
# host once, "github", "gitlab", "forgejo" (also Gitea) or "bitbucket"; and
# the tokens Forgejo, Gitea and Bitbucket requests sign in with, yours and
# the agent account's, each written out, from a variable or printed by a
# command. Without a token only public repositories are readable.
# See docs/reference.md#forges.
# [machine.forges."git.example.com"]
# type = "forgejo"
# token = { cmd = ["security", "find-generic-password", "-s", "forgejo", "-w"] }
# agent_token = { cmd = ["op", "read", "op://dev/agent/token"] }

# Bitbucket Cloud also takes the email of an Atlassian API token's account.
# [machine.forges."bitbucket.org"]
# token = { cmd = ["security", "find-generic-password", "-s", "bitbucket", "-w"] }
# email = "you@example.com"

# Where shoal skill install adds <skill>/SKILL.md for an AI tool, and the
# proxy under machine.proxies its tracked agents reach their API through.
# [machine.agents.droid]
# skill_dir = "~/.factory/skills"

[machine.overload]
# Machine-wide agent protection; allow stop requests to free memory before retrying.
# Commented CPU and memory percentages are the balanced defaults of `load`.
poll_seconds = 2
cooldown_seconds = 5

[machine.overload.memory]
enabled = true
# Linux usage excludes reclaimable cache; macOS uses native critical pressure.
# used_percent = 95
sustained_seconds = 0

[machine.overload.cpu]
# Optional aggregate CPU protection, sustained for five minutes.
enabled = false
# used_percent = 90
sustained_seconds = 300

[machine.overload.disk]
# Available space on filesystems holding workspaces or daemon state, in GiB.
enabled = true
# Remove workspaces idle cleanup would remove, without waiting for the delay.
cleanup_free_gib = 5
# Stop tracked executions when cleanup cannot free enough space.
stop_free_gib = 2

[machine.overload.recovery]
# Automatically restore agents with a resume command or built-in resume arguments.
enabled = true
# Require headroom for a full minute; restart agents one at a time.
# memory_used_percent = 80
# cpu_used_percent = 75
sustained_seconds = 60

[machine.overload.warning]
# Message running agents to reduce load before an enabled protection stops them.
enabled = true
# Linux usage; macOS warns at native warning pressure.
# memory_used_percent = 85
# cpu_used_percent = 80
cpu_sustained_seconds = 60
disk_free_gib = 10
# Least time between repeated warnings about one signal to one workspace.
repeat_minutes = 30

[machine.simulators]
# Xcode simulator leases (macOS).
max_booted = 2
max_devices = 4
idle_seconds = 120
allow_any = false
# Example profile; `default` must name a profile defined below it.
# default = "phone"
# [machine.simulators.profiles.phone]
# device = "iPhone 17"
# runtime = "iOS 26"

[agent]
# Agent `shoal add <issue-url>` starts when --agent is omitted (no default):
# a built-in AI tool or one defined under [agents].
# default = "codex"
# The model and reasoning effort the default agent runs with, over its tool's.
# model = "gpt-5.5"
# effort = "high"
# Directories every agent and chat may read without a permission prompt, as
# other working directories. Entries are absolute or start with ~/.
dirs = ["/tmp"]
# Agents of one repository that run at once, as a positive number; by default
# only [machine] max_agents limits them.
# max_running = 3
# The Git profile from [machine.git_profiles] for tracked agents' Git commands.
# git_profile = "agent"

# A separate account for tracked agents: user-owned forge executable wrappers.
# See docs/reference.md#agent-accounts for setup.
# [agent.forge_clis]
# fj = "~/bin/fj-agent"
# gh = "~/bin/gh-agent"

# Prompt templates normally live beside this file as worker-template.md and
# chat-template.md. Inline text takes precedence over the corresponding file.
# [agent.templates]
# worker = "Follow repository instructions in {workspace} at {path}."
# chat = "Discuss the {repo} repository at {path} without changing it."

# Each AI tool's launch settings, merged option by option with a repository's.
[agents.claude]
command = ["claude"]
# `shoal claude` without --cli/--app: "cli" or "app" (the Claude app, macOS only).
default_mode = "cli"

[agents.codex]
command = ["codex", "{args}", "--sandbox", "danger-full-access", "--ask-for-approval=never"]
# `shoal codex` without --cli/--app: "cli" or "app".
default_mode = "cli"
# The model and reasoning effort its agents run with; --model and --effort
# override them for one launch. Without them the tool uses its own defaults.
# model = "gpt-5.5"
# effort = "medium"

# A custom agent: shoal add <repository> <branch> --agent droid. Its resume
# command must restore a session rather than repeat the initial prompt.
# [agents.droid]
# command = ["droid", "{args}"]
# resume_command = ["droid", "resume", "{path}"]
# model_args = ["--model", "{model}"]
# effort_args = ["--reasoning-effort", "{effort}"]

# Named workspace shortcuts: shoal check [workspace] -- <extra arguments>
# [commands]
# check = ["cargo", "test"]
# Local committed-change review, with tuicr installed on PATH:
# review = ["tuicr", "-r", "{diff_base}..HEAD"]

[terminal]
# `shoal add` focuses workspace shells and agents waiting for a prompt, and
# starts agents with input in the background: a background Herdr tab, or a
# detached zmx session outside Herdr. Set to always (true) or never (false) focus.
# focus = true
# Close the Herdr tab or zmx session Shoal opened for a workspace once the
# workspace is removed, or once `done` keeps it and the agent finishes its turn.
close_when_done = true
# Where launches from a terminal outside Herdr and Rex run: detached zmx
# sessions ("zmx"), tabs on the local Herdr server ("herdr"), or windows on the
# local Rex server ("rex").
default_host = "zmx"

[terminal.herdr]
# Use Herdr tabs and panes; false runs as in a plain terminal.
enabled = true
# Run issue/add in a new tab inside Herdr, after interactive choices.
new_tab = true
# The workspace for tabs Shoal opens outside a Herdr pane.
workspace_name = "{repo}"
# Override [terminal] close_when_done for Herdr tabs.
# close_when_done = true
# tab_name = "{repo}: {branch}"

[terminal.rex]
# Use Rex windows and blocks; false runs as in a plain terminal.
enabled = true
# Run issue/add in a new window inside Rex, after interactive choices.
new_window = true
# Open that place as a new window ("window") or a split beside the caller's
# block ("split").
placement = "window"
# The session for windows Shoal opens outside a Rex session.
session_name = "{repo}"
# Override [terminal] close_when_done for Rex windows.
# close_when_done = true
# window_name = "{repo}: {branch}"

[terminal.happy]
# Offer happy-claude and happy-codex, which start detached Happy sessions.
enabled = false

[setup]
# Copy the main checkout's ignored files into the worktree before setup.
copy_ignored = true

# Optional untracked lifecycle hooks; repository values replace these commands.
# Each value is one executable path, relative to the worktree or absolute.
# [hooks]
# post_setup = "/path/to/attach" # After readiness, in the CLI with a terminal.
# pre_remove = "/path/to/detach" # Before removal, in the daemon without a terminal.

[cleanup.auto]
# Remove idle, clean, pushed or landed workspaces automatically.
enabled = true
idle_minutes = 10

[cleanup.pr]
# Remove completed workspaces once every watched PR has merged.
enabled = true

[cleanup.merged]
# Remove workspaces merged into the default branch once idle, done or not.
enabled = true
idle_minutes = 240

[cleanup.restore]
# Keep removed workspaces restorable with shoal work restore for this long, with up
# to this much of their uncommitted and untracked files.
retention_days = 30
archive_max_mb = 50

[ports]
# Range for automatic TCP port reservations.
start = 49152
end = 65535

# Variables exported to tracked executions and hooks. Values substitute
# {workspace}, {workspace_path}, {repo}, {branch}, {port.NAME} and
# {cache.NAME} once.
# [env]
# AGENT_BROWSER_SESSION = "{workspace}"
# AGENT_BROWSER_PROFILE = "{workspace_path}/.agent-browser"
# GOCACHE = "{cache.go}"

# A tool cache every workspace of a repository shares; only for tools that
# lock or address entries by content.
# [caches.go]
# scope = "shared"

# A command `shoal demo start` keeps running for the user to try; `preset`
# ("server", "web" or "simulator") says how `shoal demo` opens it.
# [demos.web]
# preset = "web"
# cmd = ["npm", "run", "dev"]

# Example permits shared across repositories; see the command reference.
# [resources.signing]
# capacity = 1
# reason = "Signing service"
# [resource_pools.devices]
# capacity = 2
# [resource_pools.devices.resources.alpha]
# capacity = 1

# Clean up when an agent marks its workspace done; false keeps it for review.
[cleanup.done]
enabled = true

# Agent reviews of PRs and issues post their findings; --post and --no-post override it.
[review]
post = true

# Hold agent messages until none has arrived for this many seconds, so a run of
# them, such as approval decisions, reaches the agent together; 0 delivers each at once.
[messages]
settle_seconds = 5

# Push the default branch to its upstream after shoal land; --push and --no-push override it.
[land]
push = false

# What agents may do: "direct" at once, "propose" after your approval, or
# "deny" where it applies. Issues and PRs in the workspace's repository:
[permissions]
issue_open = "direct"
pr_open = "direct"
# Issues in other repositories than the workspace's: "deny", "propose" or "direct".
issue_other_repositories = "propose"
# shoal land: "propose" or "direct".
land = "propose"
# Requests through shoal forge api that are not reads, which you may always
# send: "deny" or "direct".
api_writes = "deny"
