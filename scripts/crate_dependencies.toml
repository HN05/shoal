# The workspace packages each workspace package may depend on, which
# scripts/check_crate_dependencies.py checks. `dependencies` covers normal and
# build dependencies, optional or not; `dev-dependencies` lists what only the
# package's tests may add. AGENTS.md, under Implementation, gives the
# principles an entry follows.

[shoal]
dependencies = ["shoal-cli", "shoal-daemon"]
dev-dependencies = ["shoal-client", "shoal-core", "shoal-forge", "shoal-protocol", "shoal-schedule"]

