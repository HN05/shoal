[package]
name = "shoal-forge"
version = "0.1.0"
description = "Issues, PRs, reviews and CI on GitHub, Forgejo, Gitea, GitLab and Bitbucket"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# A loopback forge for the caller's tests.
test-support = ["shoal-forge-types/test-support"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
shoal-forge-derive.workspace = true
shoal-forge-types.workspace = true
shoal-refs.workspace = true
shoal-subprocess.workspace = true
shoal-text.workspace = true
shoal-time.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
shoal-forge-types = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
