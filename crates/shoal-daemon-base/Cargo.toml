[package]
name = "shoal-daemon-base"
version.workspace = true
description = "What every subsystem of Shoal's daemon uses: its log, config, gates, events, notifications and file access"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# What the daemon's tests use of the types here.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-core.workspace = true
shoal-forge.workspace = true
shoal-forge-types = { workspace = true, features = ["rusqlite"] }
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-schedule.workspace = true
shoal-store.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
