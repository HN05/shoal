[package]
name = "shoal-repositories"
version.workspace = true
description = "The repositories a Shoal daemon registers"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What the daemon's tests of moves interrupt a move between.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge.workspace = true
shoal-forge-types.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs.workspace = true
shoal-store.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
