[package]
name = "shoal-core"
version.workspace = true
description = "The code Shoal's CLI and daemon share"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Fixtures for the tests of crates that use this one.
test-support = []

[dependencies]
aes-gcm = "0.11"
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
crypto_box = { version = "0.9", features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["std"] }
fs2 = "0.4"
futures-util.workspace = true
libc.workspace = true
plist = "1"
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-client = { workspace = true, features = ["clap", "rusqlite"] }
shoal-forge = { workspace = true, features = ["clap", "rusqlite"] }
shoal-proxy.workspace = true
shoal-subprocess.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
toml_edit.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
shoal-client = { workspace = true, features = ["test-support"] }
shoal-forge = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
