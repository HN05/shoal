[package]
name = "shoal-daemon"
version.workspace = true
description = "Shoal's daemon"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What other crates' tests drive a daemon with: `test_daemon`.
test-support = ["shoal-core/test-support", "shoal-protocol/test-support"]

[dependencies]
anyhow.workspace = true
form_urlencoded = "1"
fs2 = "0.4"
futures-util = { workspace = true, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
ring = "0.17"
rusqlite = { workspace = true, features = ["bundled"] }
# The hub link's TLS, through the provider shoal-proxy uses too.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-core.workspace = true
shoal-forge.workspace = true
shoal-forge-types = { workspace = true, features = ["rusqlite"] }
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
shoal-schedule = { workspace = true, features = ["rusqlite"] }
shoal-subprocess.workspace = true
socket2 = "0.6"
tempfile.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
toml_edit.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
# systemd-logind's shutdown delay lock and announcements, over the system bus.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
hmac = "0.13"
shoal-core = { workspace = true, features = ["test-support"] }
shoal-forge = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
