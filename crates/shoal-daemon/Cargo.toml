[package]
name = "shoal-daemon"
version.workspace = true
description = "Shoal's daemon"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# What other crates' tests drive a daemon with: `test_daemon`.
test-support = [
    "shoal-agents/test-support",
    "shoal-core/test-support",
    "shoal-daemon-base/test-support",
    "shoal-protocol/test-support",
    "shoal-spaces/test-support",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
fs2 = "0.4"
futures-util = { workspace = true, features = ["sink"] }
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
shoal-agents.workspace = true
shoal-apps.workspace = true
shoal-demos.workspace = true
shoal-coordination.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge.workspace = true
shoal-forge-types = { workspace = true, features = ["rusqlite"] }
shoal-hub.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-leases.workspace = true
shoal-links.workspace = true
shoal-power.workspace = true
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
shoal-repositories.workspace = true
shoal-reviews.workspace = true
shoal-runner.workspace = true
shoal-schedule = { workspace = true, features = ["rusqlite"] }
shoal-spaces.workspace = true
shoal-store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
shoal-agents = { workspace = true, features = ["test-support"] }
shoal-core = { workspace = true, features = ["test-support"] }
shoal-daemon-base = { workspace = true, features = ["test-support"] }
shoal-demos = { workspace = true, features = ["test-support"] }
shoal-forge = { workspace = true, features = ["test-support"] }
shoal-hub = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-links = { workspace = true, features = ["test-support"] }
shoal-repositories = { workspace = true, features = ["test-support"] }
shoal-reviews = { workspace = true, features = ["test-support"] }
shoal-spaces = { workspace = true, features = ["test-support"] }
shoal-runner = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
