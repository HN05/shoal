[package]
name = "shoal-protocol"
version = "0.1.0"
description = "The Shoal daemon's protocol: its requests, responses and the types they carry"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Store typed names in SQLite columns.
rusqlite = [
    "dep:rusqlite",
    "shoal-forge-types/rusqlite",
    "shoal-ids/rusqlite",
    "shoal-refs/rusqlite",
    "shoal-schedule/rusqlite",
    "shoal-states/rusqlite",
    "shoal-time/rusqlite",
]
# Take typed names as CLI values.
clap = ["dep:clap", "shoal-states/clap"]
# Conversions and paths for the tests of crates that use this one.
test-support = ["shoal-ids/test-support"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
imara-diff = { version = "0.2", default-features = false }
clap = { workspace = true, features = ["derive"], optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-config-derive.workspace = true
shoal-forge-types.workspace = true
shoal-ids.workspace = true
shoal-refs.workspace = true
shoal-schedule.workspace = true
shoal-states.workspace = true
shoal-time.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
shlex = "2"
shoal-ids = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
