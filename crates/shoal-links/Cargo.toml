[package]
name = "shoal-links"
version.workspace = true
description = "The issues, PRs and CI runs a Shoal daemon's spaces link"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What the daemon's tests of links read: whether a space's wait runs.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge.workspace = true
shoal-forge-types = { workspace = true, features = ["rusqlite"] }
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs.workspace = true
shoal-store.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
shoal-ids = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
