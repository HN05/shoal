[package]
name = "shoal-forge-types"
version = "0.1.0"
description = "Forge repositories, items and the data their requests return, read without a request"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Store typed names in SQLite columns.
rusqlite = ["dep:rusqlite", "shoal-refs/rusqlite", "shoal-states/rusqlite"]
# Take typed names as CLI values.
clap = ["shoal-states/clap"]
# Conveniences for the tests of crates that use this one.
test-support = []

[dependencies]
anyhow.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
shoal-forge-derive.workspace = true
shoal-refs.workspace = true
shoal-states.workspace = true

[dev-dependencies]
tempfile.workspace = true
