[package]
name = "shoal-coordination"
version.workspace = true
description = "Alerts, threads, approvals, permissions and scope between the spaces of Shoal's daemon"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge.workspace = true
shoal-forge-types.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
shoal-store.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
