[package]
name = "shoal-client"
version = "0.1.0"
description = "The connection to the Shoal daemon and the operations apps share with the CLI"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
shoal-forge-types.workspace = true
shoal-ids.workspace = true
shoal-protocol.workspace = true
shoal-schedule.workspace = true
shoal-states.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
