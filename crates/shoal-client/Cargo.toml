[package]
name = "shoal-client"
version = "1.0.0"
description = "A typed, stable API to Shoal's daemon for apps other than Shoal's CLI"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
