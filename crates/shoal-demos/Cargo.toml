[package]
name = "shoal-demos"
version.workspace = true
description = "The demos Shoal's daemon records with their executions, and their viewers"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The fixtures the daemon's tests of demos across subsystems share.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-store.workspace = true
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util"] }
