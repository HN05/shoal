[package]
name = "shoal-store"
version.workspace = true
description = "The daemon's SQLite store: its schema, migrations and shared row mappers"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Fixtures for the tests of crates over the store.
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
rusqlite = { workspace = true, features = ["bundled", "functions"] }
serde.workspace = true
serde_json.workspace = true
shoal-core.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
