[package]
name = "shoal-reviews"
version.workspace = true
description = "The local reviews Shoal's daemon runs, and the gate agent"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What the daemon's tests use to wait for a review's run to end.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge.workspace = true
shoal-forge-types.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
shoal-store.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
