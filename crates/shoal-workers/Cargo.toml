[package]
name = "shoal-workers"
version.workspace = true
description = "The execution wrapper and the workers: the code that runs in the processes Shoal starts and calls the daemon"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
fs2 = "0.4"
futures-util.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
shoal-client.workspace = true
shoal-core.workspace = true
shoal-forge-types.workspace = true
shoal-ids.workspace = true
shoal-protocol.workspace = true
shoal-proxy.workspace = true
shoal-refs.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
# The overload tests run the execution wrapper under a daemon.
shoal-daemon = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
