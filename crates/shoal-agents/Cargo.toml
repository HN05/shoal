[package]
name = "shoal-agents"
version.workspace = true
description = "The agents a Shoal daemon runs"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What the daemon's tests drive of the service directly: the clock alerts
# settle by.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-forge-types = { workspace = true, features = ["rusqlite"] }
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-refs = { workspace = true, features = ["rusqlite"] }
shoal-schedule = { workspace = true, features = ["rusqlite"] }
shoal-store.workspace = true
shoal-subprocess.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "time"] }
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
