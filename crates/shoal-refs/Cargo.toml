[package]
name = "shoal-refs"
version = "0.1.0"
description = "The commit and branch name types the Shoal crates share"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Store commits and branch names in SQLite columns.
rusqlite = ["dep:rusqlite"]

[dependencies]
rusqlite = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
anyhow.workspace = true
serde_json.workspace = true
