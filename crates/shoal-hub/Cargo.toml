[package]
name = "shoal-hub"
version.workspace = true
description = "The hub that joins Shoal daemons on several machines"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# What the daemon's tests of the hub share: two sides of a link.
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
sha2 = "0.11"
tempfile.workspace = true
shoal-core.workspace = true
shoal-daemon-base.workspace = true
shoal-ids = { workspace = true, features = ["rusqlite"] }
shoal-protocol = { workspace = true, features = ["rusqlite"] }
shoal-schedule.workspace = true
shoal-store.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
uuid = { workspace = true, features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
shoal-core = { workspace = true, features = ["test-support"] }
shoal-ids = { workspace = true, features = ["test-support"] }
shoal-protocol = { workspace = true, features = ["test-support"] }
shoal-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
