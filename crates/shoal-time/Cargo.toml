[features]
# Store times in SQLite columns.
rusqlite = ["dep:rusqlite"]

[dependencies]
libc.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
anyhow.workspace = true
serde_json.workspace = true
