# PR and main checks; the rust job, which runs on Shoal runners, and the musl
# job, on Docker, are intended as the required checks on the `main` protection
# rule.
#
# A PR whose only `area/` label is `area/docs` runs no checks: the gate job
# reads the labels and the rust and musl jobs' check steps skip themselves,
# which still reports a status for the required check.
# Pushes to main and dispatches always run everything, except that a release
# PR (`release/v*`) and its version commit on main run no checks: release.py
# validates that tree itself.
#
# A draft PR (Forgejo's draft state is a `WIP:` or `[WIP]` title prefix) runs
# no checks, and pushing to it starts none. Taking it out of draft is a title
# edit, so the `edited` type is admitted, but Forgejo's payload for an edit
# carries no previous title. The undraft job decides at runtime instead: a
# ready PR's head gets a run when it is opened or pushed, so an edit runs the
# checks only when the head has no rust status and no running gate, which is
# the case right after the PR leaves draft. Edits queue apart from other runs,
# so they never cancel one.
#
# The rust and musl jobs take their names from matrices that wait on the
# gate's output. Forgejo posts no commit status for such a job until the gate
# has finished, and none when the gate is skipped, so drafts and other edits
# never post to the required checks. A skipped status there would count as
# passing: Forgejo ranks `skipped` above `success`. The undraft job names the
# rust and gate contexts; keep them in step with the job names.
#
# The rust job runs on a Shoal runner (docs/reference.md#runner), on Linux or
# macOS, whichever machine with `runner.enabled` for this repository admits it
# first. Steps run on that machine's host with its installed tools, in a
# disposable workspace at the job's commit, so there is no checkout step. The
# workspace starts from the seed build of main that .shoal.toml's `cargo`
# preset makes, so a job rebuilds only what its commit changed. Build settings
# that change Cargo's fingerprints, such as CARGO_INCREMENTAL or a profile's
# debuginfo, would rebuild everything instead. The undraft and gate jobs only
# query the forge and gain nothing from a seeded workspace, so they stay on
# Docker, as does the musl job, which needs the CI image's Zig and musl
# targets.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Drafts and edits get groups of their own; edits queue instead of cancelling,
  # so a later edit never cancels the run that leaving draft started.
  group: >-
    ci-${{ (github.event.pull_request.draft && 'draft-') ||
    (github.event.action == 'edited' && 'edited-') || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'edited' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  undraft:
    name: undraft (edits run the checks only after leaving draft)
    if: github.event.action == 'edited' && !github.event.pull_request.draft
    runs-on: docker
    container:
      # The cross-build job's image; it carries curl and jq.
      image: git.henriknordvik.com/hn05/ci-shoal:1.99
    outputs:
      run: ${{ steps.statuses.outputs.run }}
    steps:
      - name: Look for checks on the PR's head
        id: statuses
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          # A failed lookup must not drop the checks: fall through to running them.
          # This run's own gate is pending from the start, so its statuses do not count.
          checks=$(curl -sf --max-time 20 -H "Authorization: token $TOKEN" "$API" | jq -r --arg run "/actions/runs/$RUN/" '.statuses[]
              | select(.target_url | contains($run) | not)
              | select(.context == "ci / rust (fmt, clippy, test, scripts) (pull_request)"
                  or (.context == "ci / gate (docs-only PRs skip the checks) (pull_request)" and .status != "skipped"))
              | "\(.context): \(.status)"') \
            || { echo "status lookup failed; running the checks"; checks=""; }
          if [ -n "$checks" ]; then
            printf 'The head already has checks:\n%s\n' "$checks"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "The PR has left draft: running the checks"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate (docs-only PRs skip the checks)
    needs: undraft
    # The undraft job runs only for edits; a failed one leaves its output empty
    # and the checks run. Release PRs and their version commits on main skip
    # the checks (see the top of the file).
    if: >-
      !cancelled() && !github.event.pull_request.draft &&
      needs.undraft.outputs.run != 'false' &&
      !startsWith(github.head_ref, 'release/v') &&
      !startsWith(github.event.head_commit.message, 'chore: prepare release v')
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.99
    outputs:
      docs_only: ${{ steps.labels.outputs.docs_only }}
      # Name the rust and musl jobs through their matrices (see the top of
      # the file).
      checks: fmt, clippy, test, scripts
      musl_checks: check, identity test
    steps:
      - name: Read the PR's area labels
        id: labels
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Labels are added right after the PR opens, so only the opened run can race them.
          if [ "$ACTION" = opened ]; then sleep 15; fi
          # A failed lookup must not narrow the checks: fall through to running them all.
          labels=$(curl -sf --max-time 20 -H "Authorization: token $TOKEN" "$API" | jq -r '.labels[].name') \
            || { echo "label lookup failed; running every check"; labels=""; }
          areas=$(printf '%s\n' "$labels" | grep '^area/' || true)
          echo "area labels: ${areas:-none}"
          if [ "$areas" = "area/docs" ]; then
            echo "docs-only PR: skipping the checks"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    # Named `rust (fmt, clippy, test, scripts)` by its matrix, which waits on
    # the gate (see the top of the file). A skipped gate skips this job without
    # a status.
    name: rust
    needs: gate
    # A failed gate leaves docs_only empty and every check runs.
    if: "!cancelled()"
    strategy:
      matrix:
        checks: ["${{ needs.gate.outputs.checks }}"]
    runs-on: shoal
    # A Shoal runner never stops a running job on its own.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.SHOAL_WORKSPACE_PATH }}
    env:
      DOCS_ONLY: ${{ needs.gate.outputs.docs_only }}
    steps:
      - name: Toolchain
        if: env.DOCS_ONLY != 'true'
        run: .forgejo/scripts/check-toolchain.sh && wt --version

      - name: Release script tests
        if: env.DOCS_ONLY != 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: cargo fmt --check
        if: env.DOCS_ONLY != 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: env.DOCS_ONLY != 'true'
        run: |
          cargo clippy --locked --all-targets -- -D warnings

      - name: cargo check of each crate alone
        if: env.DOCS_ONLY != 'true'
        # A workspace build unifies features; each crate must also build alone.
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo check --locked --manifest-path "$manifest"
          done

      # Nextest runs the tests of every binary in one pool; doc tests are
      # libtest's alone. .config/nextest.toml has the ci profile.
      - name: cargo nextest run
        if: env.DOCS_ONLY != 'true'
        run: cargo nextest run --locked --profile ci

      - name: cargo test --doc
        if: env.DOCS_ONLY != 'true'
        run: cargo test --doc --locked

  # Distributed Linux binaries link musl, whose libc types differ from GNU's:
  # the shipped code must compile against them. The CI image has Zig,
  # cargo-zigbuild and the musl targets, so every PR gets this check whichever
  # machine takes the rust job, and it runs beside that job. The release
  # workflow builds every target.
  musl:
    # Named `musl (check, identity test)` by its matrix, which waits on the
    # gate (see the top of the file). A skipped gate skips this job without a
    # status.
    name: musl
    needs: gate
    # A failed gate leaves docs_only empty and every check runs.
    if: "!cancelled()"
    strategy:
      matrix:
        checks: ["${{ needs.gate.outputs.musl_checks }}"]
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.99
    env:
      DOCS_ONLY: ${{ needs.gate.outputs.docs_only }}
      # Empty outside PRs.
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      # Runner-mounted volume; a plain directory when unmounted.
      CARGO_TARGET_DIR: /ci-target
      RUSTFLAGS: '-D warnings'
    steps:
      # The checkout is shallow, so it fetches the PR's base commit too for
      # the identity test's path filter. A base it cannot fetch runs the test.
      - name: Checkout
        if: env.DOCS_ONLY != 'true'
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:${{ github.token }}' | base64 | tr -d '\n')"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          if [ -n "$PR_BASE" ]; then
            git -c http.extraheader="$auth" fetch -q --depth 1 origin "$PR_BASE" ||
              echo "could not fetch the PR's base $PR_BASE"
          fi

      # One step, because the /ci-target slot lasts as long as the step's
      # shell. The slot keeps its build, unlike the cross-build's, so the
      # dependencies stay warm. Instead of `cargo clean`, the tracked files are
      # touched once the slot is held: newer than any build already in it,
      # Cargo rebuilds the workspace's packages rather than take another
      # branch's build of them as fresh.
      - name: musl check and identity test (holding a /ci-target slot)
        if: env.DOCS_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          . .forgejo/scripts/lock-target-dir.sh
          git ls-files -z | xargs -0 touch -h --
          musl_target="$(uname -m)-unknown-linux-musl"
          cargo-zigbuild check --locked --target "$musl_target" --lib --bins
          # GNU-only tests cannot catch musl's unsupported Metadata::created().
          # Testing rebuilds the whole binary with codegen for 5 tests of the
          # identity module, so a PR runs them only when it changes that
          # module, the dependencies or this workflow; pushes to main and
          # dispatches, and a PR whose base the checkout lacks, always run them.
          if [ -z "$PR_BASE" ] || ! git cat-file -e "$PR_BASE^{commit}" 2>/dev/null ||
              ! git diff --quiet "$PR_BASE" HEAD -- \
                src/daemon/workspace/identity.rs src/daemon/workspace/identity \
                Cargo.toml Cargo.lock .forgejo/workflows/ci.yml; then
            cargo-zigbuild test --locked --target "$musl_target" --bin shoal daemon::workspace::identity
          else
            echo "the PR leaves the identity module and the dependencies alone: skipping the musl test"
          fi

  # Release targets need every Rust target and the pinned Zig, which the CI
  # image has and Shoal runners need not.
  cross-build:
    name: cross-build release binaries (manual runs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: docker
    container:
      # Built from .forgejo/ci-image/Containerfile on the runner host; the tag is
      # the Rust version.
      image: git.henriknordvik.com/hn05/ci-shoal:1.99
    env:
      # Runner-mounted volume; a plain directory when unmounted.
      CARGO_TARGET_DIR: /ci-target
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:${{ github.token }}' | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      # One step, because the /ci-target slot lasts as long as the step's shell.
      - name: Cross-build (holding a /ci-target slot)
        shell: bash
        run: |
          set -euo pipefail
          . .forgejo/scripts/lock-target-dir.sh
          cargo clean --workspace
          while read -r target _platform _selectors <&3; do
            .forgejo/scripts/cross-build.sh "$target" 3<&-
          done 3< .forgejo/scripts/release-targets.txt
