name: Code audit

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      focus:
        description: Audit focus (bugs, maintainability, testing, performance or docs)
        type: choice
        options:
          - bugs
          - maintainability
          - testing
          - performance
          - docs
        required: true
        default: bugs
      ref:
        description: Branch, tag or commit (empty uses the default branch)
        type: string
        required: false
        default: ''

concurrency:
  group: code-audit
  cancel-in-progress: false

jobs:
  audit:
    name: review-bot audit (${{ matrix.focus }})
    runs-on: docker
    # Room for the lead attempt and the fallback agent's attempt.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        focus: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.focus) || '["bugs","maintainability","testing","performance","docs"]') }}
    container:
      image: docker.io/library/node:22-bookworm
      volumes:
        - /var/lib/review-bot/claude:/var/lib/review-bot/claude
        - /var/lib/review-bot/codex:/var/lib/review-bot/codex
    steps:
      - uses: https://git.henriknordvik.com/HN05/review-bot@main
        with:
          mode: audit
          agent: codex
          audit-focus: ${{ matrix.focus }}
          audit-ref: ${{ inputs.ref || '' }}
          audit-instructions-file: .review/audit.md
          # The whole application takes longer to inspect than one area did.
          audit-timeout-seconds: '2700'
          # Reuse a writable shared mount to serialize issue creation across containers.
          audit-lock-dir: /var/lib/review-bot/codex/audit-locks
          codex-model: ${{ vars.AUDIT_CODEX_MODEL || 'gpt-6-astra' }}
          max-turns: '80'
          claude-auth-dir: /var/lib/review-bot/claude
          codex-auth-dir: /var/lib/review-bot/codex
