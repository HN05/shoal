name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (blank chooses the next unused patch)
        type: string
        required: false

concurrency:
  group: shoal-release
  cancel-in-progress: false

jobs:
  publish:
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    runs-on: docker
    container:
      image: rust:1.98-trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Check configuration
        env:
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test "$REF" = refs/heads/main || { echo 'Select main to release'; exit 1; }
          test -n "$TOKEN" || { echo 'Configure RELEASE_AUTOMATION_TOKEN'; exit 1; }
          test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN'; exit 1; }
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git lsof zsh python3 ca-certificates
          rustup component add rustfmt clippy
          cargo install --locked worktrunk --version 0.78.0
      - name: Check out main
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          git clone "$SERVER/$REPO.git" source
          git -C source checkout --detach origin/main
          git -C source config user.name 'Shoal release bot'
          git -C source config user.email 'shoal-release@users.noreply.github.com'
      - name: Create release
        id: publish
        env:
          TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          SERVER: ${{ github.server_url }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          unset TOKEN
          cd source
          if [ -n "$REQUESTED_VERSION" ]; then
            python3 scripts/release.py run "$REQUESTED_VERSION"
          else
            python3 scripts/release.py run
          fi
          tag=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  update-tap:
    needs: publish
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - tap: homebrew-tap
            source: forgejo
          - tap: homebrew-tap-github
            source: github
    container:
      image: debian:trixie-slim
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ca-certificates
      - name: Check out release
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 -c 'import os,re; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", os.environ["RELEASE_TAG"]), "expected stable vX.Y.Z tag"'
          git init source
          git -C source remote add origin "${FORGEJO_SERVER%/}/$REPOSITORY.git"
          git -C source fetch --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git -C source checkout --detach "refs/tags/$RELEASE_TAG"
      - name: Update shared tap
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ matrix.tap }}
          SOURCE_KIND: ${{ matrix.source }}
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN in Shoal Actions secrets'; exit 1; }
          # Keep credentials out of remote URLs, Git config files, and arguments.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${FORGEJO_SERVER%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          export GIT_TERMINAL_PROMPT=0
          unset TAP_TOKEN
          git clone --branch main "${FORGEJO_SERVER%/}/${REPOSITORY%/*}/$TAP_REPOSITORY.git" tap
          git -C tap config user.name 'Shoal release bot'
          git -C tap config user.email 'shoal-release@users.noreply.github.com'
          source_url="${FORGEJO_SERVER%/}/$REPOSITORY.git"
          if [ "$SOURCE_KIND" = github ]; then
            source_url="https://github.com/$REPOSITORY.git"
          fi
          # Recompute after a rejected push so simultaneous project releases
          # preserve one another's changes. Never force-push the shared tap.
          for attempt in 1 2 3; do
            python3 source/scripts/update-homebrew.py "$RELEASE_TAG" tap --source-url "$source_url"
            if git -C tap diff --quiet -- Formula/shoal.rb; then
              exit 0
            fi
            git -C tap add Formula/shoal.rb
            git -C tap commit -m "Update Shoal to $RELEASE_TAG"
            if git -C tap push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            git -C tap fetch origin main
            # This is the disposable CI clone, containing only our failed commit.
            git -C tap reset --hard origin/main
          done
