name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (blank chooses the next unused patch)
        type: string
        required: false

concurrency:
  group: shoal-release
  cancel-in-progress: false

jobs:
  publish:
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    runs-on: docker
    container:
      # Built from .forgejo/ci-image/Containerfile on the runner host; bump the
      # tag together with ci.yml.
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
    defaults:
      run:
        shell: bash
    env:
      # Runner-mounted volume shared with ci.yml; see its header comment.
      CARGO_TARGET_DIR: /ci-target
    steps:
      - name: Check configuration
        env:
          REF: ${{ github.ref }}
          TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Not GITHUB_*: Forgejo reserves that prefix for secret names.
          RELEASE_TOKEN_GITHUB: ${{ secrets.RELEASE_TOKEN_GITHUB }}
        run: |
          test "$REF" = refs/heads/main || { echo 'Select main to release'; exit 1; }
          test -n "$TOKEN" || { echo 'Configure RELEASE_AUTOMATION_TOKEN'; exit 1; }
          test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN'; exit 1; }
          test -n "$RELEASE_TOKEN_GITHUB" || { echo 'Configure RELEASE_TOKEN_GITHUB'; exit 1; }
      - name: Check out main
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          git clone "$SERVER/$REPO.git" source
          git -C source checkout --detach origin/main
          git -C source config user.name 'Shoal release bot'
          git -C source config user.email 'shoal-release@users.noreply.github.com'
      - name: Create release
        id: publish
        env:
          TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          SERVER: ${{ github.server_url }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          unset TOKEN
          cd source
          # release.py builds and tests in /ci-target; hold a slot for the whole step.
          . .forgejo/scripts/lock-target-dir.sh
          cargo clean -p shoal
          if [ -n "$REQUESTED_VERSION" ]; then
            python3 scripts/release.py run "$REQUESTED_VERSION"
          else
            python3 scripts/release.py run
          fi
          tag=$(python3 -c 'import tomllib; print("v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  update-tap:
    needs: [publish, binaries, github-release]
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - tap: homebrew-tap
            source: forgejo
          - tap: homebrew-tap-github
            source: github
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
    steps:
      - name: Check out release
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        # Load from the workflow commit so resuming older tags needs no helper there.
        run: |
          set -eu
          curl -fsS "${FORGEJO_SERVER%/}/$REPOSITORY/raw/commit/$WORKFLOW_SHA/.forgejo/scripts/checkout-release.sh" -o checkout-release.sh
          sh checkout-release.sh
      - name: Update shared tap
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ matrix.tap }}
          SOURCE_KIND: ${{ matrix.source }}
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test -n "$TAP_TOKEN" || { echo 'Configure HOMEBREW_TAP_TOKEN in Shoal Actions secrets'; exit 1; }
          # Keep credentials out of remote URLs, Git config files, and arguments.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${FORGEJO_SERVER%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')"
          export GIT_TERMINAL_PROMPT=0
          unset TAP_TOKEN
          git clone --branch main "${FORGEJO_SERVER%/}/${REPOSITORY%/*}/$TAP_REPOSITORY.git" tap
          git -C tap config user.name 'Shoal release bot'
          git -C tap config user.email 'shoal-release@users.noreply.github.com'
          source_url="${FORGEJO_SERVER%/}/$REPOSITORY.git"
          if [ "$SOURCE_KIND" = github ]; then
            source_url="https://github.com/$REPOSITORY.git"
          fi
          # Recompute after a rejected push so simultaneous project releases
          # preserve one another's changes. Never force-push the shared tap.
          for attempt in 1 2 3; do
            python3 source/scripts/update-homebrew.py "$RELEASE_TAG" tap --source-url "$source_url"
            if git -C tap diff --quiet -- Formula/shoal.rb; then
              exit 0
            fi
            git -C tap add Formula/shoal.rb
            git -C tap commit -m "Update Shoal to $RELEASE_TAG"
            if git -C tap push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            git -C tap fetch origin main
            # This is the disposable CI clone, containing only our failed commit.
            git -C tap reset --hard origin/main
          done

  # One job for every target, so the targets share one slot's host build
  # scripts and proc macros. Push mirrors carry no releases, so the GitHub
  # release below is created from these files once the tag has been mirrored.
  binaries:
    needs: publish
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: /ci-target
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Check out release
        env:
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        # Load from the workflow commit so resuming older tags needs no helper there.
        run: |
          set -eu
          curl -fsS "${FORGEJO_SERVER%/}/$REPOSITORY/raw/commit/$WORKFLOW_SHA/.forgejo/scripts/checkout-release.sh" -o checkout-release.sh
          sh checkout-release.sh
      - name: Cross-build release binaries (holding a /ci-target slot)
        run: |
          set -euo pipefail
          cd source
          . .forgejo/scripts/lock-target-dir.sh
          mkdir -p dist
          # Archives are reproducible for a tag (fixed mtime, owner and order, no
          # gzip timestamp), so a rerun attaches the same bytes it would have.
          epoch=$(git log -1 --format=%ct)
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            case "$target" in
              x86_64-unknown-linux-musl) platform=linux-x86_64 ;;
              aarch64-unknown-linux-musl) platform=linux-arm64 ;;
              x86_64-apple-darwin) platform=macos-x86_64 ;;
              aarch64-apple-darwin) platform=macos-arm64 ;;
              *) echo "Unknown release target: $target" >&2; exit 1 ;;
            esac
            cargo clean -p shoal --release --target "$target"
            cargo zigbuild --locked --release --target "$target"
            tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
              -C "$CARGO_TARGET_DIR/$target/release" -cf - shoal \
              -C "$PWD" SKILL.md \
              | gzip -n -9 > "dist/shoal-$RELEASE_TAG-$platform.tar.gz"
          done
          (cd dist && sha256sum shoal-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - name: Attach to the Forgejo release
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 source/scripts/publish-assets.py forgejo "$RELEASE_TAG" source/dist/*

  github-release:
    needs: [publish, binaries]
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - name: Check out release
        env:
          FORGEJO_SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        # Load from the workflow commit so resuming older tags needs no helper there.
        run: |
          set -eu
          curl -fsS "${FORGEJO_SERVER%/}/$REPOSITORY/raw/commit/$WORKFLOW_SHA/.forgejo/scripts/checkout-release.sh" -o checkout-release.sh
          sh checkout-release.sh
      - name: Download the attached binaries
        env:
          TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/releases/tags
        run: |
          set -euo pipefail
          mkdir dist
          cd dist
          curl -sf -H "Authorization: token $TOKEN" "$API/$RELEASE_TAG" \
            | jq -r '.assets[] | .name + " " + .browser_download_url' \
            | while read -r name url; do
                curl -sfL -H "Authorization: token $TOKEN" -o "$name" "$url"
              done
          # The checksums travel with the files, so a truncated download fails here.
          sha256sum -c SHA256SUMS
      - name: Create the GitHub release
        env:
          RELEASE_API_URL: ${{ github.api_url }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          RELEASE_TOKEN_GITHUB: ${{ secrets.RELEASE_TOKEN_GITHUB }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          python3 source/scripts/publish-assets.py github "$RELEASE_TAG" dist/* \
            --revision "$(git -C source rev-parse HEAD)"
