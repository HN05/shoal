# Nightly flaky-test hunt: runs the whole test suite repeatedly on main and
# writes every test that failed into one evergreen issue. Kept out of ci.yml so
# it never gates a pull request; a flaky test found here is fixed before it
# fails someone's PR. Unlike deps.yml, a finding fails the run, so the failure
# notification reaches the owner as well as the issue. It runs on a Shoal
# runner like ci.yml's rust job; see that file's header.

name: flaky

on:
  schedule:
    # Off the hour, and after the night's merges have landed.
    - cron: '41 2 * * *'
  # `shoal ci run flaky.yml --branch main` to hunt after fixing a flaky test.
  workflow_dispatch:

concurrency:
  group: flaky
  # Two runs would fight over one issue body; let the first finish.
  cancel-in-progress: false

env:
  # Rounds of `cargo nextest run`; each takes about as long as ci.yml's test step.
  ROUNDS: "10"

jobs:
  hunt:
    name: flaky-test hunt
    runs-on: shoal
    # A Shoal runner never stops a running job on its own.
    timeout-minutes: 240
    defaults:
      run:
        working-directory: ${{ env.SHOAL_WORKSPACE_PATH }}
    steps:
      - name: Toolchain
        run: .forgejo/scripts/check-toolchain.sh

      - name: Run the suite repeatedly
        env:
          # Forgejo's run URL takes the run number, not the internal run id.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/src/branch/main/.forgejo/workflows/flaky.yml
        run: |
          # Findings are published before the run fails on them.
          rc=0
          .forgejo/scripts/flaky-report.sh "$ROUNDS" > report.md || rc=$?
          echo "REPORT_RC=$rc" >> "$GITHUB_ENV"
          cat report.md

      - name: Publish into the evergreen issue
        env:
          FORGE_API: ${{ github.api_url }}
          FORGE_REPO: ${{ github.repository }}
          FORGE_TOKEN: ${{ github.token }}
          # Only used the first time, when the issue has to be created.
          ISSUE_TITLE: Flaky test report
          ISSUE_LABELS: area/infra,tracking
        run: .forgejo/scripts/publish-report.sh report.md

      - name: Fail if a test failed or a round broke
        run: |
          case "$REPORT_RC" in
            0) ;;
            1) echo "::error::a test failed on unchanged code; the issue lists it"; exit 1 ;;
            *) echo "::error::a round failed without a failing test to account for it; see the step above"; exit 1 ;;
          esac
