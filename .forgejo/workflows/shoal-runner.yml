# The rust job's checks on a Shoal runner (docs/reference.md#runner), started
# only by hand with `shoal ci run shoal-runner.yml` for a machine whose Shoal
# runs this repository's CI jobs. The job runs on that machine in a workspace
# at the run's commit, cloned from the seed build of the default branch, so it
# rebuilds only what the commit changed. It has no checkout step, since the
# workspace has the commit already, and runs every step there.

name: shoal-runner

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test, scripts)
    runs-on: shoal
    defaults:
      run:
        working-directory: ${{ env.SHOAL_WORKSPACE_PATH }}
    steps:
      - name: Release script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          # Apps build shoal::client alone, without the CLI and the daemon.
          cargo clippy --locked --lib --no-default-features -- -D warnings

      - name: cargo test
        run: cargo test --locked
