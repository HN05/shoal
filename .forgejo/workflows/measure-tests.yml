# Temporary: measures the test suite's CPU time on the runner (#1843).
name: measure-tests

on:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  measure:
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
      options: --tmpfs /tmp:rw,exec,nosuid,mode=1777,size=8g
    env:
      CARGO_TARGET_DIR: /ci-target
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:${{ github.token }}' | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Measure
        run: |
          . .forgejo/scripts/lock-target-dir.sh
          true
          true
          id; cat /proc/self/status | grep -i cap
          for args in "--pid --fork --mount-proc" "--user --map-root-user --pid --fork --mount-proc" "--map-current-user --user --pid --fork --mount-proc"; do
            echo "== unshare $args"; unshare $args sh -c 'echo pid $$; id; ps -e' 2>&1 | head -8 || true
          done
