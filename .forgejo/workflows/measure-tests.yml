# Temporary: measures the test suite's CPU time on the runner (#1843).
name: measure-tests

on:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  measure:
    runs-on: docker
    container:
      image: git.henriknordvik.com/hn05/ci-shoal:1.98
      options: --tmpfs /tmp:rw,exec,nosuid,mode=1777,size=8g
    env:
      CARGO_TARGET_DIR: /ci-target
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:${{ github.token }}' | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Measure
        run: |
          . .forgejo/scripts/lock-target-dir.sh
          base=5c21abe15c5732ea495cde9b1e7bbfdc63b30c1a
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:${{ github.token }}' | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$base"
          mkdir -p /tmp/before && git archive "$base" | tar -x -C /tmp/before
          cp scripts/profile_tests.py /tmp/before/scripts/
          target=$CARGO_TARGET_DIR
          before() { (cd /tmp/before && LIBSQLITE3_FLAGS= CARGO_TARGET_DIR=$target/before python3 scripts/profile_tests.py suite); }
          after() { CARGO_TARGET_DIR=$target/after python3 scripts/profile_tests.py suite; }
          zombies() { ps -ax -o stat= | grep -c '^Z' || true; }
          # Zombies pile up over the job, so the order balances them.
          for side in before after after before; do
            echo "== $side, zombies $(zombies), load $(cut -d' ' -f1-3 /proc/loadavg)"
            $side | grep -E '^(binary|workspaces|forge|shoal \(lib\)|total)|panicked|failed'
          done
