[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = "4"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shoal-client = { path = "crates/shoal-client" }
shoal-config-derive = { path = "crates/shoal-config-derive" }
shoal-forge = { path = "crates/shoal-forge" }
shoal-forge-derive = { path = "crates/shoal-forge-derive" }
shoal-proxy = { path = "crates/shoal-proxy" }
shoal-subprocess = { path = "crates/shoal-subprocess" }
shoal-time = { path = "crates/shoal-time" }
tempfile = "3"
tokio = "1"
toml = "1.1.6"
toml_edit = "0.25"
uuid = "1.26.1"

[package]
name = "shoal"
version = "0.15.6"
description = "Local workspaces and resource allocation for coding agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11"
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
crypto_box = { version = "0.9", features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["std"] }
fs2 = "0.4"
futures-util.workspace = true
libc.workspace = true
plist = "1"
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-client = { workspace = true, features = ["clap", "rusqlite"] }
shoal-config-derive.workspace = true
shoal-forge = { workspace = true, features = ["clap", "rusqlite"] }
shoal-proxy.workspace = true
shoal-subprocess.workspace = true
socket2 = "0.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
toml_edit.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
# systemd-logind's shutdown delay lock and announcements, over the system bus.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
shoal-client = { workspace = true, features = ["test-support"] }
shoal-forge = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

# Dependencies build optimized in dev and test builds, so tests spend less CPU
# time in their code. "*" leaves out the workspace's own crates, so a rebuild
# after an edit costs what it did.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"

# Release code with symbols for samplers; scripts/profile_shoal.py builds it.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
