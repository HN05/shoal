[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = "4"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shoal-forge = { path = "crates/shoal-forge" }
shoal-proxy = { path = "crates/shoal-proxy" }
shoal-subprocess = { path = "crates/shoal-subprocess" }
tempfile = "3"
tokio = "1"
uuid = "1.26.1"

[package]
name = "shoal"
version = "0.13.0"
description = "Local workspaces and resource allocation for coding agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["happy", "proxy"]
# Detached Happy sessions, which seed prompts through Happy's encrypted server.
happy = ["dep:aes-gcm", "dep:crypto_box", "dep:crypto_secretbox"]
# A retrying proxy between agents and their API upstream, with its HTTP and
# TLS dependencies.
proxy = ["dep:shoal-proxy"]

[dependencies]
aes-gcm = { version = "0.11", optional = true }
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
crypto_box = { version = "0.9", features = ["std"], optional = true }
crypto_secretbox = { version = "0.1", features = ["std"], optional = true }
fs2 = "0.4"
futures-util.workspace = true
libc.workspace = true
plist = "1"
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
shoal-forge = { workspace = true, features = ["clap", "rusqlite"] }
shoal-proxy = { workspace = true, optional = true }
shoal-subprocess.workspace = true
socket2 = "0.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process"] }
toml = "1.1.6"
toml_edit = "0.25"
uuid = { workspace = true, features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
# systemd-logind's shutdown delay lock and announcements, over the system bus.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Release code with symbols for samplers; scripts/profile_shoal.py builds it.
[profile.profiling]
inherits = "release"
debug = true
