[package]
name = "shoal"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
description = "Local workspaces and resource allocation for coding agents"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.10", features = ["std"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
crypto_box = { version = "0.9", features = ["std"] }
crypto_secretbox = { version = "0.1", features = ["std"] }
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process"] }
toml = "1.1.6"
toml_edit = "0.25"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
plist = "1"
