[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = "4"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
libc = "0.2"
rusqlite = "0.40.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shoal-config-derive = { path = "crates/shoal-config-derive" }
shoal-forge = { path = "crates/shoal-forge" }
shoal-proxy = { path = "crates/shoal-proxy" }
shoal-subprocess = { path = "crates/shoal-subprocess" }
tempfile = "3"
tokio = "1"
uuid = "1.26.1"

[package]
name = "shoal"
version = "0.15.3"
description = "Local workspaces and resource allocation for coding agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cli", "happy", "proxy"]
# The `shoal` command, which runs the CLI and the daemon. Without it the crate
# builds only `shoal::client`.
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:fs2",
    "dep:plist",
    "dep:rusqlite",
    "dep:sha2",
    "dep:socket2",
    "dep:tempfile",
    "dep:rustix",
    "dep:zbus",
    "shoal-forge/clap",
    "shoal-forge/rusqlite",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "uuid/v4",
]
# Detached Happy sessions, which seed prompts through Happy's encrypted server.
happy = ["cli", "dep:aes-gcm", "dep:crypto_box", "dep:crypto_secretbox"]
# A retrying proxy between agents and their API upstream, with its HTTP and
# TLS dependencies.
proxy = ["cli", "dep:shoal-proxy"]

[[bin]]
name = "shoal"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
aes-gcm = { version = "0.11", optional = true }
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env", "string"], optional = true }
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"], optional = true }
crypto_box = { version = "0.9", features = ["std"], optional = true }
crypto_secretbox = { version = "0.1", features = ["std"], optional = true }
fs2 = { version = "0.4", optional = true }
futures-util.workspace = true
libc.workspace = true
plist = { version = "1", optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", optional = true }
shoal-config-derive.workspace = true
shoal-forge.workspace = true
shoal-proxy = { workspace = true, optional = true }
shoal-subprocess.workspace = true
socket2 = { version = "0.6", optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "io-util", "process", "rt", "sync", "time"] }
toml = "1.1.6"
toml_edit = "0.25"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"], optional = true }
# systemd-logind's shutdown delay lock and announcements, over the system bus.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }

[dev-dependencies]
shoal-forge = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"

# Release code with symbols for samplers; scripts/profile_shoal.py builds it.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
